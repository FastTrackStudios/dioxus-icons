[workspace]
members = [
    "crates/dioxus-icons",
    "crates/dioxus-icons-codegen",
]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://github.com/dioxuslabs/dioxus-icons"
keywords = ["dioxus", "lucide", "icons", "svg", "components"]
categories = ["gui", "web-programming", "wasm"]
license = "MIT"
repository = "https://github.com/dioxuslabs/dioxus-icons"
rust-version = "1.85.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
# This fork tracks the Dioxus git rev architect pins (0.8.0-alpha.3 line), in
# lockstep with Task and Studio. Keep renderer feature selection in app crates.
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41", default-features = false, features = ["html", "macro"] }
# Required by Dioxus props and RSX expansion.
dioxus-signals = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
# Builds the icons' static templates by hand, outside of `rsx!`.
dioxus-vdom-template = { git = "https://github.com/DioxusLabs/dioxus", rev = "430cfb563f1b70602ef387f0c80f171d84527b41" }
lazy-js-bundle = "0.7.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
ureq = "3.1.2"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }

# The Dioxus crates from the FTS vendor fork, as architect v0.10.0 patches
# them, so this crate builds and tests against what Task and Studio resolve.
[patch."https://github.com/DioxusLabs/dioxus"]
dioxus-vdom = { git = "https://github.com/FastTrackStudios/vendor", tag = "v0.7.0" }
